name: Publicar jogo no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sincronizar-motor.cjs --verificar
      - run: node testes/validar-motor-base.cjs
      - run: node testes/validar-documentacao.cjs
      - run: node testes/validar-lideranca.cjs
      - run: node testes/validar-fluxo-dinamico.cjs
      - run: node testes/validar-elfos.cjs
      - run: node testes/validar-necromante.cjs
      - run: node testes/validar-novas-habilidades.cjs
      - run: node testes/validar-publicacao.cjs
      - run: node scripts/preparar-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
